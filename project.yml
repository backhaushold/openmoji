name: OpenMoji

# Tech spec section 3, ADR-0001 (XcodeGen + local package), ADR-0006 (App Group
# + keychain group), ADR-0011 (per-target manual Release signing), ADR-0013
# (model/quality build settings), ADR-0014 (iPad only).
# The generated OpenMoji.xcodeproj is git-ignored; run `xcodegen generate`.

options:
  bundleIdPrefix: com.backhaushold
  createIntermediateGroups: true

packages:
  OpenMojiCore:
    path: Packages/OpenMojiCore

settings:
  base:
    DEVELOPMENT_TEAM: AB5S94XWRQ
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # ADR-0013: image model and quality, one-line edits; exposed to the
    # extension as Info.plist keys OpenMojiImageModel / OpenMojiImageQuality.
    OPENMOJI_IMAGE_MODEL: gpt-image-2.5-flare
    OPENMOJI_IMAGE_QUALITY: medium

targets:
  OpenMoji:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: OpenMojiMessages
    # ADR-0006: identical entitlements on both targets.
    entitlements:
      path: App/OpenMoji.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.backhaushold.openmoji
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.backhaushold.openmoji.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backhaushold.openmoji
        # ADR-0014. Set per target: XcodeGen's iOS preset sets "1,2" at target
        # level, which would override a project-level value.
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: OpenMoji
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        # ADR-0011 / tech spec 12.5: Release signs manually with this target's
        # own profile. Never set PROVISIONING_PROFILE_SPECIFIER project-wide or
        # on the xcodebuild command line (it would apply to the extension too).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OpenMoji App Store

  OpenMojiMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
    dependencies:
      - package: OpenMojiCore
    entitlements:
      path: MessagesExtension/OpenMojiMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.backhaushold.openmoji
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.backhaushold.openmoji.shared
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenMoji
        # XcodeGen would otherwise hardcode 1.0 / 1 and defeat the release
        # lane's CURRENT_PROJECT_VERSION injection (tech spec 12.3).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        # Messages context only: declaring both contexts would put the
        # extension only in the restricted media context (tech spec section 3).
        MSSupportedPresentationContexts:
          - MSMessagesAppPresentationContextMessages
        OpenMojiImageModel: $(OPENMOJI_IMAGE_MODEL)
        OpenMojiImageQuality: $(OPENMOJI_IMAGE_QUALITY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backhaushold.openmoji.MessagesExtension
        TARGETED_DEVICE_FAMILY: "2"
        # The iMessage icon set (.stickersiconset) lives in Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OpenMoji Messages App Store

  # Tech spec section 11: unit-test bundle hosted by the shell app (which
  # embeds the extension). CI runs it with xcodebuild test on an iPad simulator.
  OpenMojiMessagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MessagesExtensionTests
    dependencies:
      - target: OpenMoji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backhaushold.openmoji.MessagesTests
        TARGETED_DEVICE_FAMILY: "2"

# Scheme for CI: `xcodebuild test -scheme OpenMojiMessagesTests` (tech spec 12.6).
schemes:
  OpenMojiMessagesTests:
    build:
      targets:
        OpenMojiMessagesTests: [test]
    test:
      targets:
        - OpenMojiMessagesTests
