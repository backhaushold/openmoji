# SwiftLint (CI runs `swiftlint lint --strict`): the default rules, minus
# cosmetic rules the code here breaks on purpose (short names like x/y/to in
# tests, long lines, long test files, `try!` in fixtures, trailing commas as
# in Package.swift). Disable more here only with a reason.
disabled_rules:
  - identifier_name
  - line_length
  - file_length
  - force_try
  - trailing_comma

excluded:
  - "**/.build"
  - "**/DerivedData"
