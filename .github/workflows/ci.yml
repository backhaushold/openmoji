# Tech spec 12.6, ADR-0012. CI only verifies: it never signs or uploads, and the
# repo has no Actions secrets (only the per-run GITHUB_TOKEN, read-only).
#
# No `paths-ignore`: the release lane's preflight needs a check run on every
# main commit. Docs-only changes take a fast path that skips steps 4-5
# (xcodegen and the simulator tests) but still produce the `verify` check run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel (or collapse) runs for main commits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    # macOS is required: OpenMojiCore uses Apple-only frameworks (ImageIO,
    # UniformTypeIdentifiers, Security, OSLog), and the extension tests need
    # the iOS SDK and a simulator. Package.swift is swift-tools-version 6.2,
    # the lowest that knows `.iOS(.v26)`, so the stock image's Xcode 26 works.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # explicit shell enables `-eo pipefail`
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # Pinned so the format gate doesn't drift with the image's preinstalled
      # version (rule sets differ between releases). Matches local dev.
      SWIFTFORMAT_VERSION: 0.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Detect docs-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # PR: checkout is the merge commit, so HEAD^1 is the base tip.
          # Push to main: compare with the previous tip.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$BEFORE_SHA"
          fi
          docs_only=false
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD)"
            echo "Changed files:"
            echo "$changed"
            # Docs-only = every changed file is a Markdown file or under docs/.
            if [ -n "$changed" ] && ! grep -qvE '^docs/|\.md$' <<<"$changed"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      # Outside the workspace, so linters never see it.
      - name: Set DerivedData path
        run: echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install gitleaks swiftlint
          mkdir -p "$RUNNER_TEMP/sfbin"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/sfbin"
          chmod +x "$RUNNER_TEMP/sfbin/swiftformat"
          echo "$RUNNER_TEMP/sfbin" >> "$GITHUB_PATH"

      # 1. Secret scan (REL-6) over the full history; findings are redacted.
      - name: gitleaks
        run: gitleaks detect --redact --verbose --no-banner

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Restored before `swift test` so hashFiles does not see Packages/**/.build.
      - name: Restore DerivedData cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', '**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # 2. Lint, pull requests only: a squash-merge can't change content that
      # was already linted, so the push-to-main run skips it.
      - name: SwiftFormat lint
        if: github.event_name == 'pull_request'
        run: |
          test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION" \
            || { echo "::error::swiftformat is $(swiftformat --version), expected $SWIFTFORMAT_VERSION"; exit 1; }
          swiftformat --lint .

      - name: SwiftLint
        if: github.event_name == 'pull_request'
        run: swiftlint lint --strict

      # 3. OpenMojiCore unit tests on the Mac host.
      - name: swift test (OpenMojiCore)
        run: swift test --package-path Packages/OpenMojiCore

      # 4-5. Skipped for docs-only changes.
      - name: xcodegen generate
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      # Pick an available iPad simulator by UDID (robust to device-name drift
      # across Xcode versions); prefer an iPad Air, the family's device.
      - name: Select an iPad simulator
        id: sim
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          devices="$(xcrun simctl list devices available)"
          line="$(grep -E 'iPad Air' <<<"$devices" | head -n1)"
          [ -n "$line" ] || line="$(grep -E 'iPad' <<<"$devices" | head -n1)"
          udid="$(grep -oE '[0-9A-F-]{36}' <<<"$line" | head -n1)"
          if [ -z "$udid" ]; then echo "::error::No iPad simulator available"; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using: $line"

      - name: xcodebuild test (OpenMojiMessagesTests)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # Ad-hoc signing (`CODE_SIGN_IDENTITY=-`, no account or profile needed
        # for a simulator) rather than CODE_SIGNING_ALLOWED=NO: an unsigned host
        # app carries no entitlements, so the Keychain round-trip in the shared
        # access group fails with errSecMissingEntitlement (-34018).
        run: |
          xcodebuild test \
            -project OpenMoji.xcodeproj \
            -scheme OpenMojiMessagesTests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- \
            | xcbeautify --renderer github-actions
